            function ranold(){
                let szám = Math.floor(Math.random()*25)+1;
                let url = "https://siminmindav.github.io/weboldalak/a/" + szám.toString().padStart(3, '0') + ".html";
                window.location.href = url;
            }

            function toggleiframes(){
                on *= -1;
                if (on === 1){
                    document.getElementById("iframek").hidden = true;
                    document.getElementById("iframesgomb").innerHTML = "weboldalak betöltése";
                    document.getElementById("iframek").innerHTML = "";
                } else {
                document.getElementById("iframek").hidden = false;
                iframelist = "";
                for (let i = 1; i < 26; i++){
                    let url = "https://siminmindav.github.io/weboldalak/a/" + i.toString().padStart(3, '0') + ".html";
                    iframelist += "<iframe src='" + url +"'> </iframe>";
                }
                document.getElementById("iframek").innerHTML = iframelist;
                document.getElementById("iframesgomb").innerHTML = "weboldalak eltűntetése";
                }
            }

            function update(){
                let szám = parseInt(document.getElementById("beszám").value);
                document.getElementById("nev").innerHTML = weboldalszótár[szám].nev;
                document.getElementById("link").innerHTML = "<a href='https://siminmindav.github.io/weboldalak/" + weboldalszótár[szám].link +"'>link</a>";
                document.getElementById("leiras").innerHTML = weboldalszótár[szám].leiras;
            }
